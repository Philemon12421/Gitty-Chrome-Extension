<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gitty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/popup.css" />
</head>
<body>

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="topbar-brand">
      <img src="../icons/icon128.png" class="brand-icon" alt="Gitty"/>
      <div class="brand-text">
        <span class="brand-name">gitty</span>
        <span class="brand-tag">✦ Explain code on GitHub</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="btn-theme-toggle" class="topbar-theme" title="Toggle light / dark theme">
        <svg class="icon-moon" width="15" height="15" viewBox="0 0 16 16" fill="none">
          <path d="M13.5 9.5A5.8 5.8 0 016.5 2.5 5.8 5.8 0 1013.5 9.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        </svg>
        <svg class="icon-sun" width="15" height="15" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.3"/>
          <path d="M8 1.3V3M8 13V14.7M1.3 8H3M13 8H14.7M3.3 3.3L4.5 4.5M11.5 11.5L12.7 12.7M3.3 12.7L4.5 11.5M11.5 4.5L12.7 3.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="btn-settings" class="topbar-settings" title="Settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.4"/>
          <path d="M8 1.5V3M8 13V14.5M1.5 8H3M13 8H14.5M3.05 3.05L4.1 4.1M11.9 11.9L12.95 12.95M3.05 12.95L4.1 11.9M11.9 4.1L12.95 3.05" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- NAV TABS -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="readme">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <rect x="1.5" y="1.5" width="11" height="12" rx="2" stroke="currentColor" stroke-width="1.3"/>
        <path d="M4 5H10M4 7.5H8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      README
    </button>
    <button class="tab-btn" data-tab="explainer">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.3"/>
        <path d="M5.5 5.5C5.5 4.7 6.2 4 7 4C7.8 4 8.5 4.7 8.5 5.5C8.5 6.3 7.5 6.7 7 7.2V8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <circle cx="7" cy="9.5" r="0.5" fill="currentColor"/>
      </svg>
      Explain Code
    </button>
    <button class="tab-btn" data-tab="history">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.3"/>
        <path d="M7 4V7.5L9 9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      History
    </button>
  </nav>

  <!-- CONTENT AREA -->
  <div class="content">

    <!-- README TAB -->
    <section id="tab-readme" class="pane active">

      <div class="import-card">
        <div class="field">
          <label>Import from GitHub <span class="hint">— optional, auto-fills the fields below</span></label>
          <div class="import-row">
            <input type="text" id="github-import-url" placeholder="https://github.com/owner/repo"/>
            <button id="btn-github-import" class="btn-secondary" type="button">
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1.5V9.5M3 6L6.5 9.5L10 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1.5 11.5H11.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
              Fetch
            </button>
          </div>
        </div>
      </div>

      <div class="form-row two">
        <div class="field">
          <label>Project Name</label>
          <input type="text" id="project-name" placeholder="my-awesome-project"/>
        </div>
        <div class="field">
          <label>Tagline</label>
          <input type="text" id="project-tagline" placeholder="Short punchy description"/>
        </div>
      </div>

      <div class="field">
        <label>Description</label>
        <textarea id="project-desc" rows="3" placeholder="What does your project do? Who is it for?"></textarea>
      </div>

      <div class="form-row three">
        <div class="field">
          <label>Language</label>
          <input type="text" id="project-lang" placeholder="Python, TS…"/>
        </div>
        <div class="field">
          <label>License</label>
          <select id="project-license">
            <option value="MIT">MIT</option>
            <option value="Apache-2.0">Apache 2.0</option>
            <option value="GPL-3.0">GPL 3.0</option>
            <option value="BSD-3">BSD 3-Clause</option>
            <option value="Unlicense">Unlicense</option>
            <option value="custom">Custom</option>
          </select>
        </div>
        <div class="field">
          <label>Badges</label>
          <select id="project-badge-style">
            <option value="flat">Flat</option>
            <option value="flat-square">Flat Square</option>
            <option value="for-the-badge">For the Badge</option>
            <option value="plastic">Plastic</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Features <span class="hint">— one per line</span></label>
        <textarea id="project-features" rows="4" placeholder="🚀 Blazing fast&#10;🔒 Secure by design&#10;🎨 Beautiful UI&#10;⚡ Zero config"></textarea>
      </div>

      <div class="field">
        <label>Install Steps <span class="hint">— one per line</span></label>
        <textarea id="project-install" rows="3" placeholder="git clone https://github.com/user/repo&#10;cd repo && npm install&#10;npm run dev"></textarea>
      </div>

      <div class="field">
        <label>GitHub Username <span class="hint">— optional</span></label>
        <input type="text" id="project-github" placeholder="your-username"/>
      </div>

      <div class="field">
        <label>Animation Style</label>
        <div class="anim-grid">
          <label class="anim-opt"><input type="radio" name="anim" value="typewriter" checked/><span class="anim-card"><em class="ademo tw">|</em>Typewriter</span></label>
          <label class="anim-opt"><input type="radio" name="anim" value="fade"/><span class="anim-card"><em class="ademo fd">✦</em>Fade In</span></label>
          <label class="anim-opt"><input type="radio" name="anim" value="slide"/><span class="anim-card"><em class="ademo sl">→</em>Slide</span></label>
          <label class="anim-opt"><input type="radio" name="anim" value="glow"/><span class="anim-card"><em class="ademo gl">◈</em>Glow</span></label>
        </div>
      </div>

      <div class="actions">
        <button id="btn-generate-readme" class="btn-primary">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1L8 5H12L8.5 7.5L10 11.5L6.5 9L3 11.5L4.5 7.5L1 5H5L6.5 1Z" fill="currentColor"/></svg>
          Generate README
        </button>
        <button id="btn-copy-readme" class="btn-secondary" disabled>
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="3.5" y="3.5" width="8" height="8.5" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 8.5V2.5A1 1 0 012.5 1.5H8.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          Copy
        </button>
        <button id="btn-save-readme" class="btn-secondary" disabled>
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 9.5V11.5H11V9.5M6.5 1.5V8.5M4 6L6.5 8.5L9 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Save .md
        </button>
      </div>

      <div id="readme-preview-wrap" class="output-box hidden">
        <div class="output-box-header">
          <span>Preview</span>
          <button id="btn-toggle-anim" class="icon-btn" title="Pause animation">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M2 1.5L9.5 5.5L2 9.5V1.5Z" fill="currentColor"/></svg>
          </button>
        </div>
        <div id="readme-preview" class="output-box-body md-render"></div>
      </div>
    </section>

    <!-- EXPLAINER TAB -->
    <section id="tab-explainer" class="pane">

      <div class="form-row three">
        <div class="field">
          <label>Language</label>
          <select id="code-language">
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
            <option value="python">Python</option>
            <option value="rust">Rust</option>
            <option value="go">Go</option>
            <option value="java">Java</option>
            <option value="cpp">C++</option>
            <option value="csharp">C#</option>
            <option value="ruby">Ruby</option>
            <option value="php">PHP</option>
            <option value="swift">Swift</option>
            <option value="kotlin">Kotlin</option>
            <option value="sql">SQL</option>
            <option value="bash">Bash</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="solidity">Solidity</option>
          </select>
        </div>
        <div class="field">
          <label>Depth</label>
          <select id="explain-depth">
            <option value="simple">Simple</option>
            <option value="detailed" selected>Detailed</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>
        <div class="field">
          <label>Theme</label>
          <select id="syntax-theme">
            <option value="dracula">Dracula</option>
            <option value="tokyo-night">Tokyo Night</option>
            <option value="monokai">Monokai</option>
            <option value="nord">Nord</option>
            <option value="github-dark">GitHub Dark</option>
            <option value="one-dark">One Dark</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Paste Your Code</label>
        <div class="code-wrap">
          <div id="line-nums" class="line-nums" aria-hidden="true">1</div>
          <textarea id="code-input" class="code-area" spellcheck="false" placeholder="// paste code here…&#10;function hello() {&#10;  return 'world';&#10;}"></textarea>
        </div>
      </div>

      <div class="actions">
        <button id="btn-explain-code" class="btn-primary">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.3"/><path d="M4.5 5C4.5 4 5.3 3.2 6.5 3.2C7.7 3.2 8.5 4 8.5 5C8.5 6 7.5 6.5 6.5 7V8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="6.5" cy="9.8" r="0.55" fill="currentColor"/></svg>
          Explain Code
        </button>
        <button id="btn-clear-code" class="btn-ghost">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1.5 1.5L11.5 11.5M11.5 1.5L1.5 11.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          Clear
        </button>
      </div>

      <div id="explanation-output" class="output-box hidden">
        <div class="output-box-header">
          <span>Explanation</span>
          <button id="btn-copy-explanation" class="icon-btn" title="Copy">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><rect x="3" y="3" width="7" height="7.5" rx="1.2" stroke="currentColor" stroke-width="1.2"/><path d="M1 7V2A1 1 0 012 1H7.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div id="explanation-body" class="output-box-body exp-render"></div>
      </div>
    </section>

    <!-- HISTORY TAB -->
    <section id="tab-history" class="pane">
      <div class="hist-controls">
        <div class="hist-seg">
          <button class="hist-btn active" data-hist="readme">READMEs</button>
          <button class="hist-btn" data-hist="code">Explanations</button>
        </div>
        <button id="btn-clear-history" class="btn-danger">Clear All</button>
      </div>

      <div id="history-readme" class="hist-list active"></div>
      <div id="history-code" class="hist-list"></div>

      <div id="history-empty" class="empty-state">
        <div class="empty-cat">
          <img src="../icons/icon128.png" alt="Gitty" style="width:56px;height:56px;object-fit:contain;opacity:0.35"/>
        </div>
        <p>Nothing here yet.</p>
        <span>Generate a README or explain some code!</span>
      </div>
    </section>

  </div><!-- /content -->

  <!-- SETTINGS MODAL -->
  <div id="settings-overlay" class="overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <h3>Settings</h3>
        <button id="btn-close-settings" class="icon-btn">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1.5 1.5L11.5 11.5M11.5 1.5L1.5 11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="settings-group">
          <h4>Appearance</h4>
          <div class="field">
            <label>Theme Mode</label>
            <select id="settings-theme-mode">
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
          </div>
          <div class="field">
            <label>Default Syntax Theme</label>
            <select id="settings-syntax-theme">
              <option value="dracula">Dracula</option>
              <option value="tokyo-night">Tokyo Night</option>
              <option value="monokai">Monokai</option>
              <option value="nord">Nord</option>
              <option value="github-dark">GitHub Dark</option>
              <option value="one-dark">One Dark</option>
            </select>
          </div>
          <div class="field">
            <label>Default Animation</label>
            <select id="settings-animation">
              <option value="typewriter">Typewriter</option>
              <option value="fade">Fade In</option>
              <option value="slide">Slide</option>
              <option value="glow">Glow</option>
            </select>
          </div>
        </div>
        <div class="settings-group">
          <h4>Behavior</h4>
          <div class="field setting-row">
            <label>Auto-copy after generate</label>
            <label class="toggle">
              <input type="checkbox" id="settings-auto-copy"/>
              <span class="toggle-track"><span class="toggle-knob"></span></span>
            </label>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button id="btn-save-settings" class="btn-primary">Save Settings</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast hidden"></div>

  <script src="popup.js" type="module"></script>
</body>
</html>
