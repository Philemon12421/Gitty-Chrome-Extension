<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gitty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/popup.css" />
</head>
<body>

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="topbar-brand">
      <img src="../icons/icon128.png" class="brand-icon" alt="Gitty"/>
      <div class="brand-text">
        <span class="brand-name">gitty</span>
        <span class="brand-tag">✦ Explain code on GitHub</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="btn-theme-toggle" class="topbar-theme" title="Toggle light / dark theme">
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      </button>
      <button id="btn-settings" class="topbar-settings" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>
  </header>

  <!-- NAV TABS -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="readme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
      README
    </button>
    <button class="tab-btn" data-tab="explainer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
      Explain Code
    </button>
    <button class="tab-btn" data-tab="history">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      History
    </button>
  </nav>

  <!-- CONTENT AREA -->
  <div class="content">

    <!-- README TAB -->
    <section id="tab-readme" class="pane active">

      <div class="import-card">
        <div class="field">
          <label>Import from GitHub <span class="hint">— optional, auto-fills the fields below</span></label>
          <div class="import-row">
            <input type="text" id="github-import-url" placeholder="https://github.com/owner/repo"/>
            <button id="btn-github-import" class="btn-secondary" type="button">
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M6.5 1.5V9.5M3 6L6.5 9.5L10 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1.5 11.5H11.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
              Fetch
            </button>
          </div>
        </div>
      </div>

      <div class="form-row two">
        <div class="field">
          <label>Project Name</label>
          <input type="text" id="project-name" placeholder="my-awesome-project"/>
        </div>
        <div class="field">
          <label>Tagline</label>
          <input type="text" id="project-tagline" placeholder="Short punchy description"/>
        </div>
      </div>

      <div class="field">
        <label>Description</label>
        <textarea id="project-desc" rows="3" placeholder="What does your project do? Who is it for?"></textarea>
      </div>

      <div class="form-row three">
        <div class="field">
          <label>Language</label>
          <input type="text" id="project-lang" placeholder="Python, TS…"/>
        </div>
        <div class="field">
          <label>License</label>
          <select id="project-license">
            <option value="MIT">MIT</option>
            <option value="Apache-2.0">Apache 2.0</option>
            <option value="GPL-3.0">GPL 3.0</option>
            <option value="BSD-3">BSD 3-Clause</option>
            <option value="Unlicense">Unlicense</option>
            <option value="custom">Custom</option>
          </select>
        </div>
        <div class="field">
          <label>Badges</label>
          <select id="project-badge-style">
            <option value="flat">Flat</option>
            <option value="flat-square">Flat Square</option>
            <option value="for-the-badge">For the Badge</option>
            <option value="plastic">Plastic</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Features <span class="hint">— one per line</span></label>
        <textarea id="project-features" rows="4" placeholder="🚀 Blazing fast&#10;🔒 Secure by design&#10;🎨 Beautiful UI&#10;⚡ Zero config"></textarea>
      </div>

      <div class="field">
        <label>Install Steps <span class="hint">— one per line</span></label>
        <textarea id="project-install" rows="3" placeholder="git clone https://github.com/user/repo&#10;cd repo && npm install&#10;npm run dev"></textarea>
      </div>

      <div class="field">
        <label>GitHub Username <span class="hint">— optional</span></label>
        <input type="text" id="project-github" placeholder="your-username"/>
      </div>

      <div class="field">
        <label>Animation Style</label>
        <div class="anim-grid">
          <label class="anim-opt"><input type="radio" name="anim" value="typewriter" checked/><span class="anim-card"><em class="ademo tw">|</em>Typewriter</span></label>
          <label class="anim-opt"><input type="radio" name="anim" value="fade"/><span class="anim-card"><em class="ademo fd">✦</em>Fade In</span></label>
          <label class="anim-opt"><input type="radio" name="anim" value="slide"/><span class="anim-card"><em class="ademo sl">→</em>Slide</span></label>
          <label class="anim-opt"><input type="radio" name="anim" value="glow"/><span class="anim-card"><em class="ademo gl">◈</em>Glow</span></label>
        </div>
      </div>

      <div class="actions">
        <button id="btn-generate-readme" class="btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          Generate README
        </button>
        <button id="btn-copy-readme" class="btn-secondary" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          Copy
        </button>
        <button id="btn-save-readme" class="btn-secondary" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Save .md
        </button>
      </div>

      <div id="readme-preview-wrap" class="output-box hidden">
        <div class="output-box-header">
          <span>Preview</span>
          <button id="btn-toggle-anim" class="icon-btn" title="Pause animation">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M2 1.5L9.5 5.5L2 9.5V1.5Z" fill="currentColor"/></svg>
          </button>
        </div>
        <div id="readme-preview" class="output-box-body md-render"></div>
      </div>
    </section>

    <!-- EXPLAINER TAB -->
    <section id="tab-explainer" class="pane">

      <div class="form-row three">
        <div class="field">
          <label>Language</label>
          <select id="code-language">
            <option value="javascript">JavaScript</option>
            <option value="typescript">TypeScript</option>
            <option value="python">Python</option>
            <option value="rust">Rust</option>
            <option value="go">Go</option>
            <option value="java">Java</option>
            <option value="cpp">C++</option>
            <option value="csharp">C#</option>
            <option value="ruby">Ruby</option>
            <option value="php">PHP</option>
            <option value="swift">Swift</option>
            <option value="kotlin">Kotlin</option>
            <option value="sql">SQL</option>
            <option value="bash">Bash</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="solidity">Solidity</option>
          </select>
        </div>
        <div class="field">
          <label>Depth</label>
          <select id="explain-depth">
            <option value="simple">Simple</option>
            <option value="detailed" selected>Detailed</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>
        <div class="field">
          <label>Theme</label>
          <select id="syntax-theme">
            <option value="dracula">Dracula</option>
            <option value="tokyo-night">Tokyo Night</option>
            <option value="monokai">Monokai</option>
            <option value="nord">Nord</option>
            <option value="github-dark">GitHub Dark</option>
            <option value="one-dark">One Dark</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Paste Your Code</label>
        <div class="code-wrap">
          <div id="line-nums" class="line-nums" aria-hidden="true">1</div>
          <textarea id="code-input" class="code-area" spellcheck="false" placeholder="// paste code here…&#10;function hello() {&#10;  return 'world';&#10;}"></textarea>
        </div>
      </div>

      <div class="actions">
        <button id="btn-explain-code" class="btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
          Explain Code
        </button>
        <button id="btn-clear-code" class="btn-ghost">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          Clear
        </button>
      </div>

      <div id="explanation-output" class="output-box hidden">
        <div class="output-box-header" style="display: flex; justify-content: space-between; align-items: center;">
          <span>Explanation</span>
          <div style="display: flex; gap: 8px;">
            <button id="btn-copy-explanation" class="icon-btn" title="Copy Text">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
            <button id="btn-copy-explanation-md" class="icon-btn" title="Copy as Markdown">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><line x1="10" y1="9" x2="8" y2="9"></line></svg>
            </button>
            <button id="btn-save-explanation-md" class="icon-btn" title="Download Markdown">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            </button>
          </div>
        </div>
        <div id="explanation-body" class="output-box-body exp-render"></div>
      </div>
    </section>

    <!-- HISTORY TAB -->
    <section id="tab-history" class="pane">
      <div class="hist-controls">
        <div class="hist-seg">
          <button class="hist-btn active" data-hist="readme">READMEs</button>
          <button class="hist-btn" data-hist="code">Explanations</button>
        </div>
        <button id="btn-clear-history" class="btn-danger">Clear All</button>
      </div>

      <div id="history-readme" class="hist-list active"></div>
      <div id="history-code" class="hist-list"></div>

      <div id="history-empty" class="empty-state">
        <div class="empty-cat">
          <img src="../icons/icon128.png" alt="Gitty" style="width:56px;height:56px;object-fit:contain;opacity:0.35"/>
        </div>
        <p>Nothing here yet.</p>
        <span>Generate a README or explain some code!</span>
      </div>
    </section>

  </div><!-- /content -->

  <!-- SETTINGS MODAL -->
  <div id="settings-overlay" class="overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <h3>Settings</h3>
        <button id="btn-close-settings" class="icon-btn">
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1.5 1.5L11.5 11.5M11.5 1.5L1.5 11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="settings-group">
          <h4>Appearance</h4>
          <div class="field">
            <label>Theme Mode</label>
            <select id="settings-theme-mode">
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
          </div>
          <div class="field">
            <label>Default Syntax Theme</label>
            <select id="settings-syntax-theme">
              <option value="dracula">Dracula</option>
              <option value="tokyo-night">Tokyo Night</option>
              <option value="monokai">Monokai</option>
              <option value="nord">Nord</option>
              <option value="github-dark">GitHub Dark</option>
              <option value="one-dark">One Dark</option>
            </select>
          </div>
          <div class="field">
            <label>Default Animation</label>
            <select id="settings-animation">
              <option value="typewriter">Typewriter</option>
              <option value="fade">Fade In</option>
              <option value="slide">Slide</option>
              <option value="glow">Glow</option>
            </select>
          </div>
        </div>
        <div class="settings-group">
          <h4>Behavior</h4>
          <div class="field setting-row">
            <label>Auto-copy after generate</label>
            <label class="toggle">
              <input type="checkbox" id="settings-auto-copy"/>
              <span class="toggle-track"><span class="toggle-knob"></span></span>
            </label>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button id="btn-save-settings" class="btn-primary">Save Settings</button>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast hidden"></div>

  <script src="popup.js" type="module"></script>
</body>
</html>
